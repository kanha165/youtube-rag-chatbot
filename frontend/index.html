<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube RAG Chatbot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
background:#0f172a;
overflow:hidden;
}

.sidebar{
width:320px;
background:#111827;
padding:20px;
border-right:1px solid #374151;
color:white;
}

.sidebar h2{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:8px;
margin-bottom:12px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
margin-bottom:12px;
}

button:hover{
background:#1d4ed8;
}

.status{
margin-top:10px;
font-size:14px;
color:#22c55e;
word-break:break-word;
}

.video-item{
margin-top:15px;
padding:10px;
background:#1e293b;
border-radius:8px;
font-size:14px;
}

.chat-area{
flex:1;
display:flex;
flex-direction:column;
}

.header{
background:#111827;
color:white;
padding:20px;
font-size:24px;
font-weight:bold;
}

.chat-box{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:15px;
}

.msg{
max-width:75%;
padding:12px 16px;
border-radius:12px;
line-height:1.6;
word-wrap:break-word;
}

.user{
align-self:flex-end;
background:#2563eb;
color:white;
}

.bot{
align-self:flex-start;
background:#1e293b;
color:white;
}

.input-area{
display:flex;
padding:15px;
background:#111827;
gap:10px;
}

.input-area input{
flex:1;
margin:0;
}

.send-btn{
width:120px;
margin:0;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>🎥 Video RAG</h2>

<button onclick="createSession()">
Create Session
</button>

<input
type="text"
id="youtubeUrl"
placeholder="Paste YouTube URL"
/>

<button onclick="processVideo()">
Upload Video
</button>

<div class="status" id="status">
No Session Created
</div>

<div id="videoList"></div>

</div>

<div class="chat-area">

<div class="header">
🤖 YouTube Chatbot
</div>

<div class="chat-box" id="chatBox">

<div class="msg bot">
Create a session and upload a YouTube video first.
</div>

</div>

<div class="input-area">

<input
type="text"
id="question"
placeholder="Ask anything from video..."
>

<button
class="send-btn"
onclick="askQuestion()">
Send
</button>

</div>

</div>

<script>

const API = "https://floors-auctions-beside-complicated.trycloudflare.com";

let SESSION_ID = null;
let VIDEO_ID = null;

function addMessage(text,type){

const chat=document.getElementById("chatBox");

const div=document.createElement("div");

div.className="msg "+type;

div.innerText=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

async function createSession(){

try{

const response=await fetch(
`${API}/session`,
{
method:"POST"
}
);

const data=await response.json();

console.log("SESSION:",data);

SESSION_ID=
data.session_id ||
data.id ||
data.sessionId;

document.getElementById("status").innerHTML=
`✅ Session: ${SESSION_ID}`;

}
catch(error){

console.error(error);

alert("Session Creation Failed");
}
}

async function processVideo(){

if(!SESSION_ID){

alert("Create Session First");

return;
}

const url=
document.getElementById("youtubeUrl").value.trim();

if(!url){

alert("Enter YouTube URL");

return;
}

try{

const response=await fetch(
`${API}/process-video`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

session_id:SESSION_ID,
url:url

})
}
);

const data=await response.json();

console.log("PROCESS VIDEO:",data);

if(
    data.status !== "success" &&
    data.status !== "already_processed"
){
    alert(data.message);
    return;
}

VIDEO_ID = data.video_id;

console.log("VIDEO ID =", VIDEO_ID);

document.getElementById("videoList").innerHTML = `
<div class="video-item">
<b>Video Added</b><br>
ID: ${VIDEO_ID}
</div>
`;

alert(data.message);

VIDEO_ID=data.video_id;

document.getElementById("videoList").innerHTML=
`
<div class="video-item">
<b>Video Added</b><br>
ID: ${VIDEO_ID}<br>
Chunks: ${data.total_chunks}
</div>
`;

alert("Video Processed Successfully");

}
catch(error){

console.error(error);

alert("Video Processing Failed");
}
}

async function askQuestion(){

if(!SESSION_ID){

alert("Create Session First");

return;
}

if(!VIDEO_ID){

alert("Upload Video First");

return;
}

const question=
document.getElementById("question").value.trim();

if(!question) return;

addMessage(question,"user");

document.getElementById("question").value="";

try{

const response=await fetch(
`${API}/ask`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

session_id:SESSION_ID,
video_id:VIDEO_ID,
question:question

})
}
);

const data=await response.json();

console.log("ANSWER:",data);

const answer=
data.answer ||
data.response ||
data.message ||
JSON.stringify(data);

addMessage(answer,"bot");

}
catch(error){

console.error(error);

addMessage(
"Server Error",
"bot"
);
}
}

document
.getElementById("question")
.addEventListener(
"keypress",
function(e){

if(e.key==="Enter"){

askQuestion();
}
}
);

</script>

</body>
</html>
